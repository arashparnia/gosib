name: PechPech package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.configuration }} with Bluetooth mock
    runs-on: ubuntu-24.04
    container:
      image: swift:6.1.2-noble@sha256:6676af406f96360a37297db0ce36d1f3998687c724dde359d6a7b43a1f809d27
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux qualification dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends python3 libsqlite3-dev pkg-config clang
          swift --version
          pkg-config --modversion sqlite3
      - name: Portable and BLE adapter mock tests with failure probes
        run: >-
          python3 scripts/check-linux-core.py --mock-bluetooth
          --configuration ${{ matrix.configuration }} --jobs 2
  package:
    name: Package on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Independent cryptographic vector
        run: node scripts/check-interop-vector.cjs
      - name: Tests
        run: swift test
      - name: Optimized tests
        run: swift test -c release
      - name: Release build
        run: swift build -c release
      - name: SwiftPM resource validation
        run: python3 scripts/check-package-resources.py
      - name: External library consumer
        run: swift build --package-path Examples/PackageConsumer -c release
      - name: iOS Simulator compile
        run: >-
          xcodebuild -scheme PechPechApple
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath .build/ios-simulator
          CODE_SIGNING_ALLOWED=NO IPHONEOS_DEPLOYMENT_TARGET=16.0
          build -quiet
      - name: iOS resource validation
        run: >-
          python3 scripts/check-package-resources.py
          --products-dir .build/ios-simulator/Build/Products/Debug-iphonesimulator
      - name: Injected-link demo
        run: swift run pechpech-demo
      - name: Published release consumer
        if: github.ref_type == 'tag'
        env:
          PECHPECH_RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/check-release-consumer.py "$PECHPECH_RELEASE_TAG"
